services:
  # Aplicación Web
  - type: web
    name: protectora-burjassot
    runtime: python
    buildCommand: pip install -r admin/requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 2 --chdir admin app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: protectora-db
          property: connectionString

# Base de datos PostgreSQL
databases:
  - name: protectora-db
    databaseName: protectora
    user: protectora
