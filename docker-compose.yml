version: '3.8'

services:
  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=development
      - SECRET_KEY=dev-secret-key-change-in-production
      - DATABASE_URL=postgresql://protectora:protectora@db:5432/protectora
      - PYTHONUNBUFFERED=1
    volumes:
      - ./uploads:/app/uploads
      - ./admin:/app/admin
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=protectora
      - POSTGRES_PASSWORD=protectora
      - POSTGRES_DB=protectora
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

volumes:
  postgres_data:
