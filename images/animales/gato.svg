  <line x1="207" y1="145" x2="235" y2="140" stroke="#8060A0" stroke-width="1.5" opacity="0.7"/>
  <line x1="208" y1="149" x2="240" y2="148" stroke="#8060A0" stroke-width="1.5" opacity="0.7"/>
