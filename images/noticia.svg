<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Fondo -->
  <rect width="200" height="200" rx="16" fill="#f0f4f8"/>

  <!-- Periódico / hoja -->
  <rect x="35" y="30" width="130" height="110" rx="8" fill="#ffffff" stroke="#90a4b9" stroke-width="2"/>

  <!-- Líneas de texto simuladas -->
  <rect x="50" y="50" width="90" height="8" rx="4" fill="#1a73a7"/>
  <rect x="50" y="68" width="100" height="5" rx="3" fill="#c5d5e4"/>
  <rect x="50" y="80" width="80" height="5" rx="3" fill="#c5d5e4"/>
  <rect x="50" y="92" width="95" height="5" rx="3" fill="#c5d5e4"/>
  <rect x="50" y="104" width="70" height="5" rx="3" fill="#c5d5e4"/>

  <!-- Imagen placeholder dentro del periódico -->
  <rect x="50" y="115" width="40" height="15" rx="3" fill="#d6e4f0"/>

  <!-- Megáfono / altavoz -->
  <ellipse cx="100" cy="165" rx="36" ry="13" fill="#1a73a7" opacity="0.12"/>
  <text x="100" y="169" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#1a73a7" font-weight="bold">Sin imagen</text>
</svg>
