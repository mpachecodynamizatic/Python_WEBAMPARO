{% extends "base.html" %}

{% block title %}Cambiar Contraseña{% endblock %}
{% block page_title %}Configuración{% endblock %}

{% block content %}
<h2 style="margin-bottom: 1.5rem;"><i class="fas fa-key"></i> Cambiar contraseña</h2>

<div style="max-width: 480px;">
    <form method="POST">
        <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">

        <div class="form-group">
            <label for="current_password">Contraseña actual *</label>
            <input type="password" id="current_password" name="current_password" required autocomplete="current-password">
        </div>

        <div class="form-group">
            <label for="new_password">Nueva contraseña * <small style="color:#666;">(mínimo 8 caracteres)</small></label>
            <input type="password" id="new_password" name="new_password" required minlength="8" autocomplete="new-password">
        </div>

        <div class="form-group">
            <label for="confirm_password">Confirmar nueva contraseña *</label>
            <input type="password" id="confirm_password" name="confirm_password" required minlength="8" autocomplete="new-password">
        </div>

        <div style="display: flex; gap: 1rem; margin-top: 2rem;">
            <button type="submit" class="btn btn-primary">
                <i class="fas fa-save"></i> Cambiar contraseña
            </button>
            <a href="{{ url_for('dashboard') }}" class="btn" style="background: #95a5a6; color: white;">
                <i class="fas fa-times"></i> Cancelar
            </a>
        </div>
    </form>
</div>
{% endblock %}
